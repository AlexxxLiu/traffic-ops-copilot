[project]
name = "traffic-ops-copilot"
version = "0.1.0"
description = "Root-cause analysis agent for traffic operations, on NYC open data"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "pandas",
    "requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]